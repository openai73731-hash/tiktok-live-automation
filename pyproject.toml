[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-live-automation"
version = "0.2.0"
description = "Local read-only TikTok LIVE assistant scaffold"
requires-python = ">=3.12"
dependencies = [
  "TikTokLive==7.0.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<18",
  "PyYAML>=6.0.3,<7",
  "openai==3.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
tiktok-live = "app.main:cli"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
