# Safe operator overlay example. Copy to config/operator.local.yaml only for a
# NEW installation; preserve an existing installation's overlay and data.
# Enter your own exact @handle through Admin Save/Apply before connecting LIVE.
tiktok:
  username: ""
  transport: android
ai:
  provider: lmstudio
  model: qwen/qwen3-8b
  temperature: 0.0
  timeout_seconds: 60.0
reply:
  mode: focused
  max_sentences: 2
  max_chars: 180
android:
  device_serial: null
ai_profile:
  name: LIVE Assistant
  topic: General conversation about this LIVE
  language: en
  system_prompt: You are the host's helpful TikTok LIVE assistant. Be honest and concise.
  reply_instruction: Answer the viewer briefly. Say when a business fact is unavailable.
  tone: Friendly, calm and natural
  model:
    provider: openai_compatible
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3-8b
    temperature: 0.0
    max_tokens: 512
  knowledge:
    enabled: false
    top_k: 3
  periodic_comments:
    enabled: true
    mode: templates
    interval_seconds: 300
    jitter_seconds: 30
    max_per_hour: 12
    instruction: Write one short neutral English ASCII statement about the active topic. No questions, testimonials, invented LIVE events, promises or promotional calls to action.
    templates:
      - Welcome to the live stream
      - We are sharing useful ideas today
      - Thanks for spending time with us
