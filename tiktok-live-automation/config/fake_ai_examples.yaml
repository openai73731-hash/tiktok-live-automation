# Deterministic DEMO fixtures, not a general-purpose translator.
# Each group contains equivalent comments; unknown text requires the operator.
scenarios:
  - language: en
    comments: ["How does the bot work?"]
    translations:
      ru: "Как работает бот?"
      es: "¿Cómo funciona el bot?"
    response_kind: facts
    fact_ids: [automatic_analysis, automatic_trades]
  - language: en
    comments: ["Is it automatic?"]
    translations:
      ru: "Это работает автоматически?"
      es: "¿Es automático?"
    response_kind: facts
    fact_ids: [automatic_analysis, automatic_trades]
  - language: en
    comments: ["Is this bot trading automatically?"]
    translations:
      ru: "Этот бот торгует автоматически?"
      es: "¿Este bot opera automáticamente?"
    response_kind: facts
    fact_ids: [automatic_analysis, automatic_trades]
  - language: en
    comments: ["Does the software speak?"]
    translations:
      ru: "Программа комментирует свои действия голосом?"
      es: "¿El programa habla?"
    response_kind: facts
    fact_ids: [voice_commentary]
  - language: en
    comments: ["Hello!", "Hi!"]
    translations: {ru: "Привет!", es: "¡Hola!"}
    response_kind: none
  - language: en
    comments: ["Thanks!", "Thank you!"]
    translations: {ru: "Спасибо!", es: "¡Gracias!"}
    response_kind: none
