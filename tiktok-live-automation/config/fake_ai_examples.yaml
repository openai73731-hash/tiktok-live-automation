  - language: en
    comments: ["It is not working"]
    translations:
      ru: "Это не работает."
      es: "No funciona."
    response_kind: unknown
  - language: ru
    comments: ["Этот бот торгует автоматически?"]
    translations:
      en: "Is this bot trading automatically?"
      es: "¿Este bot opera automáticamente?"
    response_kind: facts
    fact_ids: [automatic_analysis, automatic_trades]
  - language: ru
    comments: ["Можете гарантировать прибыль?"]
